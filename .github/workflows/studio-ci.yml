name: Static Studio checks
on:
  push:
    branches: [main]
    paths: ['index.html', 'studio/**', 'v2/**', 'catalog/**', 'skills/**', 'tools/*.py', 'release-approval.json', '.github/workflows/studio-ci.yml']
  pull_request:
    paths: ['index.html', 'studio/**', 'v2/**', 'catalog/**', 'skills/**', 'tools/*.py', '.github/workflows/studio-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test static workbench without keys or provider calls
        run: |
          node --test studio/tests/*.test.mjs
          node --test skills/live2d-local/tests/*.test.mjs
          python3 -B tools/package_local_skill.py
          python3 -B -m unittest discover -s studio/tests -p 'test_*.py' -v
      - name: Verify frozen site and build Studio with recorded homepage entry
        run: python3 -B tools/build.py --base /live2d_models/ --site-addition --source .
      - uses: actions/upload-artifact@v4
        with:
          name: studio-code-addition
          path: dist
          include-hidden-files: true
  # Existing branch-based GitHub Pages performs the actual site build/deploy.
  # This artifact contains Studio additions and the recorded homepage update.
  # It must never replace the whole site; all existing model assets stay in place.
  # No Pages-source, environment, Actions-permission or OIDC setting is changed.
